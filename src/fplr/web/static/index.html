<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPL Assistant</title>
<style>
  :root {
    --bg:#0d0e11; --surface:#16181d; --surface-2:#1c1f26; --border:#262a33;
    --ink:#e7e9ee; --ink-2:#a6adbb; --ink-3:#6f7686;
    --accent:#3987e5; --accent-soft:rgba(57,135,229,.14);
    --good:#3fbf7f; --warn:#e0a33a; --bad:#e66767;
    --radius:14px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    color-scheme:dark;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.6 var(--font); -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }

  header {
    display:flex; align-items:center; gap:14px;
    padding:14px 22px; border-bottom:1px solid var(--border);
    background:rgba(13,14,17,.86); backdrop-filter:blur(12px);
    position:sticky; top:0; z-index:10;
  }
  .mark {
    width:30px; height:30px; border-radius:9px; flex:none;
    background:linear-gradient(140deg,var(--accent),#7b5cf0);
    display:grid; place-items:center; font-weight:700; font-size:13px; color:#fff;
  }
  .title { font-weight:600; letter-spacing:-.01em; }
  .sub { color:var(--ink-3); font-size:12.5px; }
  header .spacer { flex:1; }
  .pill {
    font-size:12px; color:var(--ink-2); border:1px solid var(--border);
    background:var(--surface); padding:5px 11px; border-radius:999px; white-space:nowrap;
  }
  .pill b { color:var(--ink); font-weight:600; }

  main { flex:1; overflow-y:auto; scroll-behavior:smooth; }
  .thread { max-width:820px; margin:0 auto; padding:28px 22px 12px; }

  .msg { display:flex; gap:13px; margin-bottom:26px; animation:rise .28s ease both; }
  @keyframes rise { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .avatar {
    width:29px; height:29px; border-radius:9px; flex:none; margin-top:2px;
    display:grid; place-items:center; font-size:11px; font-weight:700;
  }
  .msg.bot .avatar { background:linear-gradient(140deg,var(--accent),#7b5cf0); color:#fff; }
  .msg.me  .avatar { background:var(--surface-2); color:var(--ink-2); border:1px solid var(--border); }
  .body { min-width:0; flex:1; }
  .who { font-size:12px; color:var(--ink-3); margin-bottom:5px; }
  .msg.me .bubble {
    background:var(--surface-2); border:1px solid var(--border);
    padding:11px 15px; border-radius:var(--radius); display:inline-block;
  }

  /* rendered markdown */
  .md > *:first-child { margin-top:0; }
  .md > *:last-child  { margin-bottom:0; }
  .md h1,.md h2,.md h3 { line-height:1.3; letter-spacing:-.01em; margin:22px 0 9px; }
  .md h1 { font-size:20px; } .md h2 { font-size:17px; } .md h3 { font-size:15px; }
  .md h2 { padding-top:16px; border-top:1px solid var(--border); }
  .md p { margin:0 0 11px; }
  .md ul,.md ol { margin:0 0 11px; padding-left:20px; }
  .md li { margin:5px 0; }
  .md strong { color:#fff; font-weight:650; }
  .md em { color:var(--ink-2); }
  .md hr { border:0; border-top:1px solid var(--border); margin:20px 0; }
  .md a { color:var(--accent); }
  .md code {
    font:12.5px/1.5 var(--mono); background:var(--surface-2);
    border:1px solid var(--border); padding:1px 5px; border-radius:5px;
  }
  .md blockquote {
    margin:0 0 11px; padding:2px 0 2px 14px;
    border-left:3px solid var(--accent); color:var(--ink-2);
  }
  .md table { border-collapse:collapse; width:100%; font-size:13.5px; margin:0 0 12px; }
  .md th,.md td { padding:7px 11px; border-bottom:1px solid var(--border); text-align:right; }
  .md th:first-child,.md td:first-child { text-align:left; }
  .md th { color:var(--ink-3); font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; }
  .md .tw { overflow-x:auto; }

  /* tool activity */
  .tools { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 11px; }
  .tool {
    font:11.5px/1 var(--mono); color:var(--ink-2);
    background:var(--accent-soft); border:1px solid rgba(57,135,229,.28);
    padding:5px 9px; border-radius:7px; animation:rise .2s ease both;
  }
  .tool.search { background:rgba(123,92,240,.16); border-color:rgba(123,92,240,.34); }

  .thinking { display:flex; align-items:center; gap:9px; color:var(--ink-3); font-size:13.5px; }
  .dots { display:inline-flex; gap:4px; }
  .dots i {
    width:5px; height:5px; border-radius:50%; background:var(--ink-3);
    animation:pulse 1.25s infinite ease-in-out;
  }
  .dots i:nth-child(2){animation-delay:.16s} .dots i:nth-child(3){animation-delay:.32s}
  @keyframes pulse { 0%,80%,100%{opacity:.25;transform:scale(.85)} 40%{opacity:1;transform:scale(1)} }

  .err {
    border:1px solid rgba(230,103,103,.4); background:rgba(230,103,103,.09);
    color:#ffc9c9; padding:12px 15px; border-radius:var(--radius); font-size:14px;
  }

  /* composer */
  footer { border-top:1px solid var(--border); background:rgba(13,14,17,.9); backdrop-filter:blur(12px); }
  .composer { max-width:820px; margin:0 auto; padding:14px 22px 20px; }
  .chips { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:11px; }
  .chip {
    font-size:12.5px; color:var(--ink-2); background:var(--surface);
    border:1px solid var(--border); padding:6px 12px; border-radius:999px; cursor:pointer;
    transition:.14s;
  }
  .chip:hover { color:var(--ink); border-color:#3a4150; background:var(--surface-2); }
  .inputrow {
    display:flex; gap:10px; align-items:flex-end;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:9px 9px 9px 15px; transition:border-color .15s;
  }
  .inputrow:focus-within { border-color:#3d5a80; }
  textarea {
    flex:1; background:none; border:0; outline:0; resize:none; color:var(--ink);
    font:15px/1.55 var(--font); max-height:180px; padding:5px 0;
  }
  textarea::placeholder { color:var(--ink-3); }
  button.send {
    flex:none; width:34px; height:34px; border-radius:9px; border:0; cursor:pointer;
    background:var(--accent); color:#fff; display:grid; place-items:center; transition:.14s;
  }
  button.send:disabled { background:var(--surface-2); color:var(--ink-3); cursor:not-allowed; }
  button.send:not(:disabled):hover { background:#4a93ea; }
  .hint { display:flex; gap:14px; margin-top:9px; font-size:11.5px; color:var(--ink-3); }
  .hint .spacer { flex:1; }
  .linkbtn { color:var(--ink-3); background:none; border:0; cursor:pointer; font:inherit; padding:0; }
  .linkbtn:hover { color:var(--ink-2); text-decoration:underline; }
</style>
</head>
<body>

<header>
  <div class="mark">FPL</div>
  <div>
    <div class="title">FPL Assistant</div>
    <div class="sub" id="subtitle">loading…</div>
  </div>
  <div class="spacer"></div>
  <div class="pill" id="gwpill" hidden></div>
</header>

<main id="main"><div class="thread" id="thread"></div></main>

<footer>
  <div class="composer">
    <div class="chips" id="chips">
      <button class="chip" data-q="Who should I captain and why?">Who should I captain?</button>
      <button class="chip" data-q="What is the single best transfer for my team this week?">Best transfer</button>
      <button class="chip" data-q="Which of my players are at risk of not starting?">Rotation risk</button>
      <button class="chip" data-q="How accurate is the model, honestly?">Model accuracy</button>
    </div>
    <div class="inputrow">
      <textarea id="input" rows="1" placeholder="Ask about your team, transfers, captaincy…"></textarea>
      <button class="send" id="send" title="Send">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
          <path d="M8 13V3M8 3L3.5 7.5M8 3l4.5 4.5" stroke="currentColor"
                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="hint">
      <span>Enter to send · Shift+Enter for a new line</span>
      <span class="spacer"></span>
      <button class="linkbtn" id="regen">Regenerate brief</button>
      <button class="linkbtn" id="reset">New chat</button>
    </div>
  </div>
</footer>

<script>
const thread  = document.getElementById('thread');
const main    = document.getElementById('main');
const input   = document.getElementById('input');
const sendBtn = document.getElementById('send');
let sessionId = null;
let busy = false;

/* ---- minimal markdown renderer -------------------------------------------
   Deliberately hand-rolled: this is a local, offline-capable app, and pulling a
   library from a CDN would make it fail without a network connection.        */
function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function markdown(src){
  const lines = src.replace(/\r/g,'').split('\n');
  let html = '', list = null, i = 0;

  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };

  while (i < lines.length) {
    const line = lines[i];

    // table: a header row followed by a |---| separator
    if (/^\s*\|/.test(line) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1] || '')) {
      closeList();
      const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c => inline(c.trim()));
      let out = '<div class="tw"><table><thead><tr>' +
                cells(line).map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && /^\s*\|/.test(lines[i])) {
        out += '<tr>' + cells(lines[i]).map(c => `<td>${c}</td>`).join('') + '</tr>';
        i++;
      }
      html += out + '</tbody></table></div>';
      continue;
    }

    let m;
    if (!line.trim())                            { closeList(); }
    else if (/^\s*(---|\*\*\*|___)\s*$/.test(line)) { closeList(); html += '<hr>'; }
    else if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
      closeList();
      const lvl = Math.min(m[1].length, 3);
      html += `<h${lvl}>${inline(m[2])}</h${lvl}>`;
    }
    else if ((m = line.match(/^\s*>\s?(.*)$/)))  { closeList(); html += `<blockquote>${inline(m[1])}</blockquote>`; }
    else if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) {
      if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; }
      html += `<li>${inline(m[1])}</li>`;
    }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; }
      html += `<li>${inline(m[1])}</li>`;
    }
    else { closeList(); html += `<p>${inline(line)}</p>`; }
    i++;
  }
  closeList();
  return html;
}

/* ---- message plumbing --------------------------------------------------- */
function addMessage(role, html){
  const el = document.createElement('div');
  el.className = 'msg ' + (role === 'user' ? 'me' : 'bot');
  el.innerHTML =
    `<div class="avatar">${role === 'user' ? 'JD' : 'FPL'}</div>` +
    `<div class="body"><div class="who">${role === 'user' ? 'You' : 'Assistant'}</div>` +
    `<div class="content">${html}</div></div>`;
  thread.appendChild(el);
  scroll();
  return el.querySelector('.content');
}

function scroll(){ main.scrollTop = main.scrollHeight; }

const TOOL_LABEL = {
  score_players:'ranking players', captaincy_candidates:'checking haul odds',
  explain_player:'breaking down a projection', get_fixtures:'reading fixtures',
  get_model_metrics:'checking model accuracy', get_my_team:'loading your squad',
  web_search:'searching the news'
};

function thinkingBlock(target, label){
  target.innerHTML =
    `<div class="tools"></div>` +
    `<div class="thinking"><span class="dots"><i></i><i></i><i></i></span><span>${label}</span></div>`;
  return { tools: target.querySelector('.tools'), status: target.querySelector('.thinking span:last-child') };
}

async function streamRun(url, payload, target, label){
  const ui = thinkingBlock(target, label);
  const seen = new Set();
  let answered = false;

  const res = await fetch(url, {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
  });
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream:true });
    const frames = buffer.split('\n\n');
    buffer = frames.pop();

    for (const frame of frames) {
      const line = frame.split('\n').find(l => l.startsWith('data: '));
      if (!line) continue;
      const ev = JSON.parse(line.slice(6));

      if (ev.type === 'session') { sessionId = ev.session_id; }
      else if (ev.type === 'tools') {
        for (const name of ev.names) {
          if (seen.has(name)) continue;
          seen.add(name);
          const chip = document.createElement('span');
          chip.className = 'tool' + (name === 'web_search' ? ' search' : '');
          chip.textContent = TOOL_LABEL[name] || name;
          ui.tools.appendChild(chip);
        }
        ui.status.textContent = 'working through the numbers…';
        scroll();
      }
      else if (ev.type === 'paused') { ui.status.textContent = 'still searching…'; }
      else if (ev.type === 'text') {
        answered = true;
        const tools = ui.tools.outerHTML;
        target.innerHTML = tools + `<div class="md">${markdown(ev.text)}</div>`;
        scroll();
      }
      else if (ev.type === 'error') {
        answered = true;
        target.innerHTML = `<div class="err">${esc(ev.message)}</div>`;
        scroll();
      }
      else if (ev.type === 'saved') { loadContext(true); }
    }
  }
  if (!answered) target.innerHTML = `<div class="err">The run ended without a reply.</div>`;
}

async function send(text){
  if (busy || !text.trim()) return;
  busy = true; sendBtn.disabled = true;
  addMessage('user', `<div class="bubble">${esc(text)}</div>`);
  input.value = ''; input.style.height = 'auto';
  const target = addMessage('assistant', '');
  try {
    await streamRun('/api/chat', { session_id: sessionId, message: text }, target, 'thinking…');
  } catch (e) {
    target.innerHTML = `<div class="err">Lost connection to the local server. Is it still running?</div>`;
  }
  busy = false; sendBtn.disabled = false; input.focus();
}

/* ---- first paint: greet with the latest brief --------------------------- */
async function loadContext(silent){
  const ctx = await (await fetch('/api/context')).json();
  document.getElementById('subtitle').textContent =
    ctx.gameweek ? `Gameweek ${ctx.gameweek}` : 'Fantasy Premier League';
  if (ctx.deadline) {
    const d = new Date(ctx.deadline);
    const pill = document.getElementById('gwpill');
    pill.innerHTML = `Deadline <b>${d.toLocaleString(undefined,
      { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })}</b>`;
    pill.hidden = false;
  }
  if (silent) return ctx;

  if (ctx.brief) {
    const body = ctx.brief.markdown.replace(/^#\s+.*\n+/, '').replace(/^\*.*\*\n+/m, '');
    addMessage('assistant',
      `<div class="md"><p>Hi Jordan, here is the latest gameweek report…</p></div>` +
      `<div class="md">${markdown(body)}</div>`);
  } else {
    const target = addMessage('assistant',
      `<div class="md"><p>Hi Jordan — there is no saved report yet, so I am writing one now.</p></div>`);
    const holder = document.createElement('div');
    target.appendChild(holder);
    busy = true; sendBtn.disabled = true;
    await streamRun('/api/brief/generate', {}, holder, 'writing your gameweek report…');
    busy = false; sendBtn.disabled = false;
  }
  return ctx;
}

/* ---- wiring ------------------------------------------------------------- */
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 180) + 'px';
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value); }
});
sendBtn.addEventListener('click', () => send(input.value));
document.getElementById('chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) send(chip.dataset.q);
});
document.getElementById('reset').addEventListener('click', async () => {
  await fetch('/api/reset', { method:'POST', headers:{'Content-Type':'application/json'},
                              body:JSON.stringify({ session_id: sessionId, message:'' }) });
  sessionId = null; thread.innerHTML = ''; loadContext();
});
document.getElementById('regen').addEventListener('click', async () => {
  if (busy) return;
  busy = true; sendBtn.disabled = true;
  const target = addMessage('assistant', '');
  await streamRun('/api/brief/generate', {}, target, 'writing a fresh gameweek report…');
  busy = false; sendBtn.disabled = false;
});

loadContext();
</script>
</body>
</html>
